<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="walletClip">
      <rect x="80" y="140" width="352" height="240" rx="36" ry="36" />
    </clipPath>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" ry="128" fill="#800000" />

  <!-- Wallet Container Group -->
  <g clip-path="url(#walletClip)">
    <!-- Top Bright Red Flap / Card -->
    <rect x="80" y="140" width="352" height="60" fill="#e50914" />
    <!-- Separator Stripe -->
    <rect x="80" y="200" width="352" height="12" fill="#990000" />
    <!-- Main Wallet Body -->
    <rect x="80" y="212" width="352" height="168" fill="#b30000" />
  </g>

  <!-- Left Expense / Arrow Badge -->
  <g>
    <circle cx="140" cy="282" r="48" fill="#f85050" />
    <path d="M122 264 L158 300" stroke="#ffffff" stroke-width="9" stroke-linecap="round" />
    <path d="M136 300 H158 V278" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Right Navy Clasp -->
  <g>
    <path d="M432 230 H320 A 40 40 0 0 0 320 310 H432 Z" fill="#0f172a" />
    <circle cx="330" cy="270" r="14" fill="#ffffff" />
  </g>
</svg>